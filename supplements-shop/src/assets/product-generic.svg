<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Supplement bottle illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" rx="28" fill="url(#bg)"/>

  <!-- Soft decorative shapes -->
  <circle cx="110" cy="110" r="64" fill="#d1fae5" opacity="0.8"/>
  <circle cx="540" cy="90" r="52" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="520" cy="320" r="70" fill="#dcfce7" opacity="0.7"/>

  <!-- Bottle shadow -->
  <ellipse cx="320" cy="332" rx="150" ry="22" fill="#0f172a" opacity="0.08"/>

  <!-- Cap -->
  <rect x="232" y="86" width="176" height="70" rx="20" fill="url(#cap)"/>
  <rect x="252" y="74" width="136" height="28" rx="14" fill="#0b1220" opacity="0.9"/>

  <!-- Bottle body -->
  <rect x="210" y="140" width="220" height="190" rx="40" fill="url(#bottle)" stroke="#e2e8f0" stroke-width="4"/>

  <!-- Label -->
  <rect x="232" y="190" width="176" height="98" rx="18" fill="#0f172a" opacity="0.96"/>
  <rect x="252" y="210" width="110" height="10" rx="5" fill="#e2e8f0" opacity="0.95"/>
  <rect x="252" y="232" width="140" height="10" rx="5" fill="#94a3b8" opacity="0.9"/>
  <rect x="252" y="254" width="90" height="10" rx="5" fill="#94a3b8" opacity="0.9"/>

  <!-- Badge dot -->
  <circle cx="392" cy="218" r="16" fill="#10b981" opacity="0.95"/>
  <circle cx="392" cy="218" r="6" fill="#064e3b" opacity="0.9"/>

  <!-- Tiny pills -->
  <g opacity="0.9">
    <rect x="126" y="270" width="64" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <rect x="458" y="250" width="74" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <rect x="474" y="260" width="34" height="8" rx="4" fill="#10b981" opacity="0.9"/>
  </g>
</svg>
